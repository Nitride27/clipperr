<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clipperr</title>
<link rel="icon" type="image/svg+xml" href="/web/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ---------- colours: "pro editor" (Premiere/DaVinci-style neutrals, one blue). Canvases read these too. ---------- */
:root {
  --bg: #1e1e1e; --panel: #252526; --panel-2: #2d2d30; --line: #333337; --line-2: #45454a; --sunk: #181818;
  --ink: #d4d4d4; --dim: #9d9d9d; --faint: #6e6e6e;
  --hot1: #2d8cff; --hot2: #5aa5ff; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
  --on-hot: #ffffff; --on-ok: #0d1117; --glass: rgba(30, 30, 30, .86); --seis: #1a1a1a;
}
:root {
  --display: "Big Shoulders Display", "Arial Narrow", sans-serif;
  --body: "Instrument Sans", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --r: 10px; --grad: linear-gradient(90deg, var(--hot1), var(--hot2));
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
[hidden] { display: none !important; }
.mono { font-family: var(--mono); font-size: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- controls ---------- */
.btn { border: 1px solid var(--line); background: var(--panel); padding: 8px 12px; border-radius: var(--r); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; justify-content: center; text-decoration: none; white-space: nowrap; }
a.btn { color: var(--ink); }
.btn:hover:not(:disabled) { border-color: var(--line-2); background: var(--panel-2); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.go { background: var(--grad); border: 0; color: var(--on-hot); font-weight: 700; padding: 10px 18px; }
.btn.go:hover:not(:disabled) { filter: brightness(1.07); background: var(--grad); }
.btn.ok { background: var(--ok); color: var(--on-ok); border: 0; font-weight: 700; }
.btn.ok:hover:not(:disabled) { background: var(--ok); filter: brightness(1.07); }
.btn.ghost { background: none; }
.btn.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
.btn.sm { padding: 5px 9px; font-size: 12px; }
.btn.icon { padding: 7px 9px; }
select, .seg, .field { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
select { padding: 9px 10px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 6px 11px; border-radius: 7px; cursor: pointer; color: var(--dim); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.field { padding: 9px 11px; width: 100%; }
.field:focus { border-color: var(--line-2); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent); }
.tag { font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .06em; padding: 2px 6px; border-radius: 5px; background: var(--panel-2); color: var(--dim); align-self: center; }
.tag.live { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }

/* ---------- top bar ---------- */
.bar { display: grid; grid-template-columns: 220px minmax(0, 1fr); border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-right: 1px solid var(--line); }
.brand b { font: 900 26px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand .logo { display: block; flex: none; filter: drop-shadow(0 2px 8px color-mix(in srgb, var(--hot1) 45%, transparent)); }
.brand i { margin-left: auto; width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
.brand i.on { background: var(--bad); animation: ping 1.6s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 var(--bad); } 70%, 100% { box-shadow: 0 0 0 8px transparent; } }
.barrow { display: flex; gap: 8px; padding: 10px 16px; align-items: center; flex-wrap: wrap; min-width: 0; }
form.new { display: contents; }
.url { flex: 1; min-width: 240px; }
.hint { font-size: 12px; color: var(--dim); white-space: nowrap; }
.hint b { color: var(--ok); font-weight: 600; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100vh - 62px); }
aside { border-right: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
aside h2 { font: 800 13px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin: 6px 8px; }
.jobrow { all: unset; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 9px 10px; border-radius: var(--r); border: 1px solid transparent; }
.jobrow:hover { background: var(--panel); }
.jobrow[aria-current="true"] { background: var(--panel); border-color: var(--line); }
.jobrow:focus-visible { outline: 2px solid var(--ok); }
.jobrow .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jobrow .s { grid-column: 1 / -1; font-size: 12px; color: var(--dim); }
.jobrow canvas { grid-column: 1 / -1; width: 100%; height: 22px; }
main { padding: 18px 22px 60px; min-width: 0; }

/* ---------- job head + seismograph ---------- */
.jhead { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; min-width: 0; }
.jhead h1 { font: 900 clamp(34px, 5vw, 56px)/.9 var(--display); text-transform: uppercase; margin: 0; letter-spacing: .01em; }
.jhead .meta { color: var(--dim); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-bottom: 4px; min-width: 0; }
.jhead .src { color: var(--dim); text-decoration: none; max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jhead .src:hover { color: var(--ink); text-decoration: underline; }
.jhead .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.status { font-weight: 600; }
.status.running, .status.starting { color: var(--warn); } .status.done { color: var(--ok); }
.status.error { color: var(--bad); } .status.stopped { color: var(--dim); }
.log { color: var(--dim); font-size: 13px; margin: 8px 0 0; min-height: 1.4em; }
.log.err { color: var(--bad); }
.seis { margin: 16px 0 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--seis); position: relative; overflow: hidden; }
.seis canvas { display: block; width: 100%; height: 170px; }
.seis canvas.click { cursor: pointer; }
.seis .lbl, .seis .tip { position: absolute; top: 10px; background: var(--glass); padding: 2px 6px; border-radius: 6px; }
.seis .lbl { left: 14px; font: 800 12px var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.seis .lbl span { color: var(--ink); font-family: var(--mono); font-weight: 600; letter-spacing: 0; margin-left: 8px; }
.seis .tip { right: 14px; font: 11px var(--mono); color: var(--dim); }
.seis .axis { padding: 2px 14px 8px; display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--faint); }

/* ---------- toolbar + cards ---------- */
.tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.tools .seg button b { font-family: var(--mono); font-weight: 600; margin-left: 4px; color: var(--faint); }
.tools .seg button[aria-pressed="true"] b { color: var(--ok); }
.tools .sp { flex: 1; }
.warn { display: inline-flex; gap: 6px; align-items: center; color: var(--warn); font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; transition: border-color .2s, opacity .2s; }
.card.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { border-color: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 30%, transparent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.why { display: flex; flex-wrap: wrap; gap: 5px; font: 600 11px var(--mono); }
.why span { padding: 2px 7px; border-radius: 6px; background: var(--panel-2); color: var(--ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.why span b { color: var(--hot2); font-weight: 600; }
.why .rp { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.card.posted { opacity: .55; } .card.posted:hover { opacity: 1; }
.media { position: relative; aspect-ratio: 9 / 16; background: var(--sunk); }
.media video { width: 100%; height: 100%; display: block; object-fit: cover; cursor: zoom-in; }
.chip { position: absolute; background: var(--glass); backdrop-filter: blur(6px); border-radius: 7px; color: var(--ink); }
.badge { top: 8px; left: 8px; font: 800 14px var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 4px 8px; }
.badge em { font-style: normal; color: var(--hot1); }
.fs { top: 8px; right: 8px; border: 0; padding: 4px 8px; cursor: pointer; font-size: 13px; }
.ribbon { position: absolute; bottom: 10px; left: 0; background: var(--ok); color: var(--on-ok); font: 800 12px var(--display); letter-spacing: .14em; padding: 3px 10px 3px 8px; text-transform: uppercase; }
.tc { bottom: 8px; right: 8px; font: 11px var(--mono); padding: 3px 6px; }
.work { position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; padding: 20px; text-align: center; }
.steps { display: flex; gap: 4px; justify-content: center; }
.steps i { height: 4px; border-radius: 2px; background: var(--line); width: 52px; }
.steps i.done { background: var(--ok); }
.steps i.now { background: linear-gradient(90deg, var(--line), var(--warn), var(--line)); background-size: 200% 100%; animation: slide 1.1s linear infinite; }
@keyframes slide { to { background-position: -200% 0; } }
.work p { margin: 0; color: var(--dim); font-size: 13px; }
.work.err p { color: var(--bad); font-size: 12px; word-break: break-word; }
.cb { flex: 1; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 9px; }
.strip { width: 100%; height: 30px; display: block; }
.stylechip { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--dim); min-width: 0; }
.stylechip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stylechip .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; border: 1px solid var(--line-2); }
.cap textarea { width: 100%; height: 54px; resize: vertical; background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; font-size: 12px; color: var(--dim); }
.acts2 { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.acts3 { display: grid; grid-template-columns: 1fr auto; gap: 6px; }

/* ---------- empty + toasts ---------- */
.empty { max-width: 640px; margin: 8vh auto 0; }
.empty h1 { font: 900 clamp(40px, 7vw, 76px)/.88 var(--display); text-transform: uppercase; margin: 0 0 18px; background: linear-gradient(100deg, var(--ink) 30%, var(--hot1) 70%, var(--hot2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.empty p { color: var(--dim); font-size: 15px; max-width: 520px; }
.empty dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; margin: 26px 0 0; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
.empty dt { font: 800 13px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--hot1); padding-top: 2px; }
.empty dd { margin: 0; color: var(--dim); } .empty dd code { font-family: var(--mono); font-size: 12px; color: var(--ink); }
.none { color: var(--dim); padding: 40px 0; text-align: center; grid-column: 1 / -1; }
.toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 90; }
.toast { background: var(--panel-2); border: 1px solid var(--line-2); border-left: 4px solid var(--ok); border-radius: 10px; padding: 10px 12px; display: flex; gap: 12px; align-items: center; box-shadow: 0 10px 30px #0006; animation: up .25s ease-out; max-width: 380px; }
.toast.bad { border-left-color: var(--bad); }
@keyframes up { from { transform: translateY(8px); opacity: 0; } }

/* ---------- overlays: viewer + studio ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }
.ovbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.ovbar .t { font: 900 24px/1 var(--display); text-transform: uppercase; }
.ovbar .m { color: var(--dim); font-size: 13px; }
.ovbar .sp { flex: 1; }
.viewer .stage { flex: 1; min-height: 0; display: grid; grid-template-columns: auto minmax(0, auto) auto; place-content: center; align-items: center; gap: 18px; padding: 16px; }
.viewer video { height: calc(100vh - 150px); max-width: calc(100vw - 140px); aspect-ratio: 9 / 16; background: #000; border-radius: 12px; display: block; }
.viewer .navb { width: 48px; height: 48px; border-radius: 50%; font-size: 20px; }
.viewer .foot { display: flex; gap: 8px; justify-content: center; padding: 0 16px 14px; flex-wrap: wrap; }
.keys { color: var(--faint); font: 11px var(--mono); }

.studio .body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 440px; }
.studio .left { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; min-height: 0; background: var(--sunk); }
.studio .right { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.pipe { display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--line); }
.pipe button { all: unset; cursor: pointer; padding: 12px 6px 10px; text-align: center; border-bottom: 3px solid transparent; color: var(--faint); font: 800 13px var(--display); letter-spacing: .12em; text-transform: uppercase; }
.pipe button span { display: block; font: 600 10px var(--mono); letter-spacing: 0; margin-bottom: 2px; }
.pipe button.done { color: var(--dim); }
.pipe button[aria-current="step"] { color: var(--ink); border-bottom-color: var(--hot1); }
.pipe button:focus-visible { outline: 2px solid var(--ok); outline-offset: -2px; }
.panel { flex: 1; overflow-y: auto; padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 18px; }
.panel h3 { margin: 0; font: 900 26px/1 var(--display); text-transform: uppercase; }
.panel .lead { margin: -10px 0 0; color: var(--dim); font-size: 13px; }
.grp { display: flex; flex-direction: column; gap: 8px; }
.grp > label, .grp > .lab { font-size: 12px; font-weight: 600; color: var(--dim); display: flex; justify-content: space-between; align-items: center; }
.grp > label output, .grp > .lab output { font-family: var(--mono); color: var(--ink); font-weight: 400; }
input[type=range] { width: 100%; accent-color: var(--hot1); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { all: unset; cursor: pointer; border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; align-items: center; background: var(--panel); }
.opt[aria-pressed="true"] { border-color: var(--hot1); box-shadow: 0 0 0 1px var(--hot1); }
.opt:focus-visible { outline: 2px solid var(--ok); }
.opt b { font-size: 13px; } .opt small { color: var(--dim); font-size: 11px; text-align: center; }
.mini { width: 54px; aspect-ratio: 9/16; border-radius: 5px; overflow: hidden; display: grid; background: var(--sunk); border: 1px solid var(--line-2); }
.mini.full { background: linear-gradient(var(--line), var(--line-2)); place-items: center; }
.mini.full i { width: 100%; height: 34%; background: var(--hot1); opacity: .85; }
.mini.split { grid-template-rows: 60% 40%; }
.mini.split i:first-child { background: var(--hot1); opacity: .85; } .mini.split i:last-child { background: repeating-linear-gradient(45deg, var(--ok) 0 4px, transparent 4px 8px); opacity: .7; }
.loops { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
.loop { all: unset; cursor: pointer; aspect-ratio: 9/12; border-radius: 8px; overflow: hidden; border: 2px solid var(--line); background: var(--sunk) center / cover no-repeat; display: grid; place-items: end center; font-size: 10px; }
.loop span { background: var(--glass); width: 100%; text-align: center; padding: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.loop[aria-pressed="true"] { border-color: var(--hot1); }
.loop.rand { place-items: center; font: 800 13px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.fonts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.font { all: unset; cursor: pointer; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel); display: flex; flex-direction: column; gap: 2px; }
.font b { font-size: 20px; line-height: 1.1; font-weight: 400; } .font small { font-size: 10px; color: var(--dim); }
.font[aria-pressed="true"] { border-color: var(--hot1); box-shadow: 0 0 0 1px var(--hot1); }
.font:focus-visible { outline: 2px solid var(--ok); }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }
.preset { all: unset; cursor: pointer; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-weight: 800; font-size: 13px; background: #1e1e1e; letter-spacing: .02em; }
.preset:focus-visible { outline: 2px solid var(--ok); }
.swatches { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.sw { all: unset; cursor: pointer; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line-2); }
.sw[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.sw:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
input[type=color] { width: 30px; height: 26px; border: 1px solid var(--line-2); border-radius: 6px; background: none; padding: 0; cursor: pointer; }
.toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tg { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: 13px; background: var(--panel); }
.tg input { accent-color: var(--hot1); }
.trimrow { display: grid; grid-template-columns: 54px 1fr auto; gap: 8px; align-items: center; }
.trimrow .tcv { font: 600 15px var(--mono); }
.summary { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--panel); margin: 0; }
.summary dt { color: var(--dim); } .summary dd { margin: 0; }
.big { display: flex; flex-direction: column; gap: 4px; }
.big .btn { padding: 12px; font-size: 15px; }
.big small { color: var(--dim); font-size: 12px; padding-left: 2px; }
.pfoot { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); align-items: center; }
.pfoot .dirty { color: var(--warn); font-size: 12px; flex: 1; }

.phone { position: relative; height: calc(100vh - 190px); max-width: 100%; aspect-ratio: 9 / 16; overflow: hidden; border-radius: 16px; background: #000; box-shadow: 0 20px 60px #0007; user-select: none; }
.phone img { position: absolute; display: block; }
.phone .blur { inset: -6%; width: 112%; height: 112%; object-fit: cover; filter: blur(14px) brightness(.85); }
.phone .fg { position: absolute; left: 0; width: 100%; overflow: hidden; }
.phone .fg img { top: 0; height: 100%; }
.phone .top, .phone .bot { position: absolute; left: 0; width: 100%; overflow: hidden; }
.phone .top img, .phone .bot img { inset: 0; width: 100%; height: 100%; object-fit: cover; }
.phone .bot .ph { position: absolute; inset: 0; display: grid; place-items: center; color: #fff9; font: 800 14px var(--display); letter-spacing: .14em; text-transform: uppercase; background: repeating-linear-gradient(45deg, #222 0 12px, #2a2a2a 12px 24px); }
.phone .capt { position: absolute; left: 4%; right: 4%; text-align: center; transform: translateY(-50%); cursor: ns-resize; line-height: 1.12; paint-order: stroke fill; white-space: pre-wrap; touch-action: none; }
.phone .capt.drag { outline: 1px dashed #fff8; }
.phone .capt span { display: inline-block; }
.phone .hookp { position: absolute; left: 6%; right: 6%; text-align: center; }
.phone .hookp span { display: inline; box-decoration-break: clone; -webkit-box-decoration-break: clone; line-height: 1.5; }
.phone video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }

@media (max-width: 980px) {
  .studio .body { grid-template-columns: 1fr; overflow-y: auto; }
  .studio .left { padding: 12px; }
  .phone { height: 62vh; }
  .studio .right { border-left: 0; border-top: 1px solid var(--line); }
  .panel { overflow: visible; }
}
@media (max-width: 820px) {
  .bar, .shell { grid-template-columns: minmax(0, 1fr); }
  .brand { border-right: 0; padding-bottom: 0; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; overflow-x: auto; }
  aside h2 { display: none; } .jobrow { min-width: 170px; }
  main { padding: 14px 16px 60px; }
  .url { flex-basis: 100%; min-width: 0; } .hint { flex-basis: 100%; white-space: normal; }
  .seis .tip { display: none; } .seis canvas { height: 130px; }
  .jhead .acts { margin-left: 0; } .jhead .src { max-width: 200px; }
  .viewer .stage { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .viewer .navb { display: none; }
  .viewer video { height: auto; width: 100%; max-height: calc(100vh - 170px); max-width: 100%; }
  .pipe button { font-size: 11px; letter-spacing: .06em; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="bar">
  <div class="brand"><img class="logo" src="/web/logo.svg" alt="" width="30" height="30"><b>clipperr</b><i id="pulse-dot" title="A live job is running"></i></div>
  <div class="barrow">
    <form class="new" id="new" autocomplete="off">
      <label class="url"><span class="sr">Stream or video link</span>
        <input class="field" id="url" type="url" required placeholder="Paste a Twitch, YouTube or Kick link: a channel for live, a video for VOD">
      </label>
      <span class="hint" id="detect" aria-live="polite"></span>
      <label><span class="sr">Mode</span>
        <select id="mode"><option value="auto">Auto</option><option value="live">Live</option><option value="vod">VOD</option></select>
      </label>
      <div class="seg" role="group" aria-label="Layout for new clips" id="layout">
        <button type="button" data-v="split" aria-pressed="true">Split</button>
        <button type="button" data-v="full" aria-pressed="false">Full</button>
      </div>
      <button class="btn go" type="submit">Start clipping</button>
    </form>
    <button class="btn icon ghost" id="appfs" title="Fullscreen" aria-label="Toggle fullscreen">⛶</button>
  </div>
</div>
<div class="shell">
  <aside id="jobs" aria-label="Jobs"><h2>Jobs</h2></aside>
  <main id="main"></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="/web/app.js"></script>
</body>
</html>
